  # ============================================
  # WEBSOCKET PRESENCE
  # ============================================
  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket connection endpoint
      description: |
        Establishes WebSocket connection using SockJS.
        
        **Connection URL**: `http://localhost:8080/ws`
        
        **Authentication**: Include JWT token in connect headers:
        ```javascript
        connectHeaders: {
          Authorization: 'Bearer {token}'
        }
        ```
        
        **Supported Topics**:
        - `/topic/user.presence` - User online/offline status updates
        - `/topic/chat/admin/{adminId}` - Chat messages for admin
        - `/topic/admin/notifications` - Admin notifications
        
        **Destinations to publish**:
        - `/app/user.presence` - Send user presence status
        - `/app/user.heartbeat` - Send heartbeat to keep connection alive
        - `/app/chat.send` - Send chat message
      responses:
        '101':
          description: Switching Protocols - WebSocket connection established

  /app/user.presence:
    post:
      tags:
        - WebSocket
      summary: Send user presence status (WebSocket)
      description: |
        Publishes user online/offline status via WebSocket.
        
        **Destination**: `/app/user.presence`
        
        **Broadcasts to**: `/topic/user.presence`
        
        **Automatically sent by frontend**:
        - On login: status = "ONLINE"
        - On logout/disconnect: status = "OFFLINE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - email
                - status
              properties:
                userId:
                  type: integer
                  example: 5
                email:
                  type: string
                  example: "john@example.com"
                status:
                  type: string
                  enum: [ONLINE, OFFLINE]
                  example: "ONLINE"
      responses:
        '200':
          description: Presence broadcast to all subscribers

  /app/user.heartbeat:
    post:
      tags:
        - WebSocket
      summary: Send heartbeat to keep presence alive (WebSocket)
      description: |
        Sends periodic heartbeat (every 30 seconds) to maintain user online status.
        
        **Destination**: `/app/user.heartbeat`
        
        **Automatically sent by `useWebSocketPresence` hook**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - timestamp
              properties:
                userId:
                  type: integer
                  example: 5
                timestamp:
                  type: string
                  format: date-time
                  example: "2025-12-22T10:30:00Z"
      responses:
        '200':
          description: Heartbeat received

  /topic/user.presence:
    get:
      tags:
        - WebSocket
      summary: Subscribe to user presence updates (WebSocket)
      description: |
        Subscribe to receive real-time user online/offline status updates.
        
        **Topic**: `/topic/user.presence`
        
        **Subscribers**: Admin users (for AdminChat)
        
        **Message format**:
        ```javascript
        {
          userId: 5,
          email: "john@example.com",
          status: "ONLINE" // or "OFFLINE"
        }
        ```
      responses:
        '200':
          description: Subscribed to presence updates
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    example: 5
                  email:
                    type: string
                    example: "john@example.com"
                  status:
                    type: string
                    enum: [ONLINE, OFFLINE]
                    example: "ONLINE"

